[project]
name = "mcp-example-07-docker"
version = "0.1.0"
description = "MCP server for read-only Docker inspection"
requires-python  = ">=3.10"
dependencies = [
    "mcp[cli]",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-anyio",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]